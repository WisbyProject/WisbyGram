name: Compila WisbyGram APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 0. Libera 40GB di spazio disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/ndk/* /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/chromium /opt/az /usr/share/swift || true
          df -h
      - name: 1. Scarica codice WisbyGram
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: 2. Installa Java 17 e Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: 3. Ripristina Cache C++ NDK
        uses: actions/cache/restore@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: wisby-cxx-arm64-v5
      - name: 4. Installa Android SDK 36 e NDK 27
        run: |
          sudo chmod -R 777 $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: 5. Inietta Modifica Foto e Correggi XML di Telegram
        env:
          APP_ID: ${{ secrets.TG_APP_ID }}
          APP_HASH: ${{ secrets.TG_APP_HASH }}
        run: |
          cat << 'EOF' > patch_wisby.py
          import os, re, json, glob

          # Correggi l'errore formatted="false" nei file XML di Telegram
          for xf in glob.glob("**/res/values*/*.xml", recursive=True):
              x = open(xf, "r", errors="ignore").read()
              x2 = re.sub(r'<string\s+name="([^"]+)"\s*>', r'<string name="\1" formatted="false">', x)
              if x2 != x:
                  open(xf, "w").write(x2)

          pkgs = {"org.telegram.messenger", "org.telegram.messenger.beta", "org.telegram.messenger.web", "org.telegram.messenger.regular", "org.telegram.messenger.standalone"}
          for gf in glob.glob("**/build.gradle", recursive=True):
              c = open(gf, "r", errors="ignore").read()
              for m in re.findall(r'org\.telegram\.[a-zA-Z0-9_.]+', c):
                  pkgs.update([m, m + ".beta", m + ".web", m + ".regular"])
              c2 = c.replace('"armeabi-v7a", "arm64-v8a", "x86", "x86_64"', '"arm64-v8a"')
              c2 = c2.replace("'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'", "'arm64-v8a'")
              c2 = c2.replace('"armeabi-v7a", "arm64-v8a"', '"arm64-v8a"')
              c2 = c2.replace("'armeabi-v7a', 'arm64-v8a'", "'arm64-v8a'")
              c2 = c2.replace("'-DANDROID_STL=c++_static'", "'-DANDROID_STL=c++_static', '-DCMAKE_CXX_FLAGS=-g0', '-DCMAKE_C_FLAGS=-g0'")
              if c2 != c: open(gf, "w").write(c2)
          gs = {"project_info": {"project_number": "1234567890", "firebase_url": "https://telegram.firebaseio.com", "project_id": "telegram-mod", "storage_bucket": "telegram-mod.appspot.com"}, "client": [{"client_info": {"mobilesdk_app_id": f"1:1234567890:android:{1000+i}", "android_client_info": {"package_name": p}}, "api_key": [{"current_key": "AIzaSyDummyKeyForCompilationOnly123456"}]} for i, p in enumerate(sorted(pkgs))], "configuration_version": "1"}
          for d in glob.glob("TMessagesProj*"):
              if os.path.isdir(d): json.dump(gs, open(os.path.join(d, "google-services.json"), "w"))
          aid = re.sub(r"[^0-9]", "", os.environ.get("APP_ID", ""))
          ahash = re.sub(r"[^a-zA-Z0-9]", "", os.environ.get("APP_HASH", ""))
          bv_p = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if os.path.exists(bv_p) and aid and ahash:
              bv = open(bv_p).read()
              bv = re.sub(r"APP_ID\s*=\s*[^;]+;", f"APP_ID = {aid};", bv)
              bv = re.sub(r'APP_HASH\s*=\s*"[^"]*";', f'APP_HASH = "{ahash}";', bv)
              open(bv_p, "w").write(bv)
          java_lines = [
              'package org.telegram.messenger;',
              'import android.app.Activity; import android.app.AlertDialog; import android.app.Fragment;',
              'import android.content.Context; import android.content.ContextWrapper; import android.content.DialogInterface; import android.content.Intent;',
              'import android.graphics.Bitmap; import android.graphics.BitmapFactory; import android.graphics.Canvas; import android.graphics.Color; import android.graphics.Paint; import android.graphics.Rect; import android.graphics.RectF;',
              'import android.os.Handler; import android.os.Looper; import android.view.Gravity; import android.view.MotionEvent; import android.view.View; import android.view.ViewGroup;',
              'import android.widget.Button; import android.widget.FrameLayout; import android.widget.LinearLayout;',
              'import java.io.File; import java.io.FileOutputStream; import java.io.InputStream; import java.lang.reflect.Field; import java.util.concurrent.ConcurrentHashMap;',
              'public class LocalPhotoOverrideManager {',
              '  private static final ConcurrentHashMap<String, Bitmap> cache = new ConcurrentHashMap<String, Bitmap>();',
              '  private static final ConcurrentHashMap<String, Boolean> empty = new ConcurrentHashMap<String, Boolean>();',
              '  private static final Handler h = new Handler(Looper.getMainLooper());',
              '  private static Runnable lpRun; private static float dx, dy;',
              '  private static Activity act(Context c) { while (c instanceof ContextWrapper) { if (c instanceof Activity) return (Activity)c; c = ((ContextWrapper)c).getBaseContext(); } return null; }',
              '  private static String key(View v) { try { Object m = v.getClass().getMethod("getMessageObject").invoke(v); if (m == null) return null; return String.valueOf(m.getClass().getMethod("getDialogId").invoke(m)) + "_" + String.valueOf(m.getClass().getMethod("getId").invoke(m)); } catch (Throwable t) { return null; } }',
              '  private static File file(Context c, String k) { File d = new File(c.getFilesDir(), "wisby_overrides"); if (!d.exists()) d.mkdirs(); return new File(d, k + ".jpg"); }',
              '  private static float[] bounds(View v) {',
              '    try { Field f = v.getClass().getDeclaredField("photoImage"); f.setAccessible(true); Object ir = f.get(v); float iw = ((Number)ir.getClass().getMethod("getImageWidth").invoke(ir)).floatValue(); float ih = ((Number)ir.getClass().getMethod("getImageHeight").invoke(ir)).floatValue(); if (iw > 40f && ih > 40f) return new float[]{((Number)ir.getClass().getMethod("getImageX").invoke(ir)).floatValue(), ((Number)ir.getClass().getMethod("getImageY").invoke(ir)).floatValue(), iw, ih}; } catch (Throwable ignored) {}',
              '    return new float[]{20f, 10f, Math.max(200f, v.getMeasuredWidth() - 40f), Math.max(200f, v.getMeasuredHeight() - 20f)};',
              '  }',
              '  public static void onCellDraw(Object self, Canvas c) {',
              '    if (!(self instanceof View) || !self.getClass().getSimpleName().equals("ChatMessageCell")) return;',
              '    View v = (View) self; String k = key(v); if (k == null) return;',
              '    Bitmap b = cache.get(k);',
              '    if (b == null && !Boolean.TRUE.equals(empty.get(k))) { File f = file(v.getContext(), k); if (f.exists()) b = BitmapFactory.decodeFile(f.getAbsolutePath()); if (b != null) cache.put(k, b); else empty.put(k, Boolean.TRUE); }',
              '    if (b == null || b.isRecycled()) return;',
              '    float[] r = bounds(v); c.drawBitmap(b, null, new RectF(r[0], r[1], r[0] + r[2], r[1] + r[3]), null);',
              '  }',
              '  public static void onCellTouch(final Object self, MotionEvent e) {',
              '    if (!(self instanceof View) || !self.getClass().getSimpleName().equals("ChatMessageCell")) return;',
              '    final View v = (View) self; int a = e.getActionMasked();',
              '    if (a == MotionEvent.ACTION_DOWN) {',
              '      dx = e.getX(); dy = e.getY(); if (lpRun != null) h.removeCallbacks(lpRun);',
              '      lpRun = new Runnable() { @Override public void run() { String k = key(v); if (k != null && v.getMeasuredHeight() > 120) showBtn(v, k); } };',
              '      h.postDelayed(lpRun, 450);',
              '    } else if (a == MotionEvent.ACTION_MOVE && (Math.abs(e.getX() - dx) > 30 || Math.abs(e.getY() - dy) > 30)) { if (lpRun != null) h.removeCallbacks(lpRun); }',
              '    else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) { if (lpRun != null) h.removeCallbacks(lpRun); }',
              '  }',
              '  private static void showBtn(final View cell, final String k) {',
              '    final Activity a = act(cell.getContext()); if (a == null) return;',
              '    final ViewGroup dec = (ViewGroup) a.getWindow().getDecorView();',
              '    View old = dec.findViewWithTag("wisby_btn"); if (old != null) dec.removeView(old);',
              '    final Button btn = new Button(a); btn.setTag("wisby_btn"); btn.setText("Modifica Foto (Locale)"); btn.setTextColor(Color.WHITE); btn.setBackgroundColor(0xE61E88E5);',
              '    FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(-2, -2); lp.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL; lp.topMargin = 140; dec.addView(btn, lp);',
              '    final Runnable rem = new Runnable() { @Override public void run() { if (btn.getParent() != null) dec.removeView(btn); } };',
              '    h.postDelayed(rem, 4500);',
              '    btn.setOnClickListener(new View.OnClickListener() { @Override public void onClick(View z) { h.removeCallbacks(rem); if (btn.getParent() != null) dec.removeView(btn); openEditor(a, cell, k); } });',
              '  }',
              '  public static class GalFrag extends Fragment {',
              '    public Bitmap target; public View view;',
              '    public void pick() { Intent i = new Intent(Intent.ACTION_GET_CONTENT); i.setType("image/*"); startActivityForResult(Intent.createChooser(i, "Scegli Foto"), 9992); }',
              '    @Override public void onActivityResult(int req, int res, Intent d) { if (req == 9992 && res == Activity.RESULT_OK && d != null && d.getData() != null && getActivity() != null) { try { InputStream s = getActivity().getContentResolver().openInputStream(d.getData()); Bitmap p = BitmapFactory.decodeStream(s); if (s != null) s.close(); if (p != null && target != null) { new Canvas(target).drawBitmap(p, null, new Rect(0, 0, target.getWidth(), target.getHeight()), null); if (view != null) view.invalidate(); } } catch (Exception ignored) {} } }',
              '  }',
              '  private static void openEditor(final Activity a, final View cell, final String k) {',
              '    final Bitmap work = Bitmap.createBitmap(Math.max(300, cell.getWidth()), Math.max(300, cell.getHeight()), Bitmap.Config.ARGB_8888);',
              '    final Canvas sc = new Canvas(work); cell.draw(sc);',
              '    final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG); p.setColor(Color.RED); p.setStrokeWidth(18f); p.setStyle(Paint.Style.STROKE); p.setStrokeCap(Paint.Cap.ROUND);',
              '    final View dv = new View(a) { float lx, ly; @Override protected void onDraw(Canvas c) { c.drawBitmap(work, null, new Rect(0, 0, getWidth(), getHeight()), null); }',
              '      @Override public boolean onTouchEvent(MotionEvent ev) { float x = ev.getX() * work.getWidth() / Math.max(1, getWidth()), y = ev.getY() * work.getHeight() / Math.max(1, getHeight()); if (ev.getAction() == MotionEvent.ACTION_DOWN) { lx = x; ly = y; sc.drawPoint(x, y, p); invalidate(); return true; } else if (ev.getAction() == MotionEvent.ACTION_MOVE) { sc.drawLine(lx, ly, x, y, p); lx = x; ly = y; invalidate(); return true; } return true; } };',
              '    LinearLayout root = new LinearLayout(a); root.setOrientation(LinearLayout.VERTICAL);',
              '    LinearLayout bar = new LinearLayout(a); int[] cols = new int[]{Color.RED, Color.GREEN, Color.BLUE, Color.YELLOW, Color.WHITE, Color.BLACK};',
              '    for (int i = 0; i < cols.length; i++) { final int col = cols[i]; Button b = new Button(a); b.setBackgroundColor(col); b.setLayoutParams(new LinearLayout.LayoutParams(0, 100, 1f)); b.setOnClickListener(new View.OnClickListener() { @Override public void onClick(View z) { p.setColor(col); } }); bar.addView(b); }',
              '    Button gb = new Button(a); gb.setText("Sostituisci con Foto dalla Galleria");',
              '    gb.setOnClickListener(new View.OnClickListener() { @Override public void onClick(View z) { try { GalFrag f = (GalFrag) a.getFragmentManager().findFragmentByTag("w_gal"); if (f == null) { f = new GalFrag(); a.getFragmentManager().beginTransaction().add(f, "w_gal").commitAllowingStateLoss(); a.getFragmentManager().executePendingTransactions(); } f.target = work; f.view = dv; f.pick(); } catch (Exception ignored) {} } });',
              '    root.addView(bar); root.addView(gb); root.addView(dv, new LinearLayout.LayoutParams(-1, 700));',
              '    new AlertDialog.Builder(a).setTitle("Modifica Foto (Solo per te)").setView(root)',
              '      .setPositiveButton("Salva", new DialogInterface.OnClickListener() { @Override public void onClick(DialogInterface d, int w) { float[] r = bounds(cell); int rx = Math.max(0, Math.min((int)r[0], work.getWidth()-1)), ry = Math.max(0, Math.min((int)r[1], work.getHeight()-1)); int rw = Math.min((int)r[2], work.getWidth()-rx), rh = Math.min((int)r[3], work.getHeight()-ry); Bitmap cropped = (rw > 20 && rh > 20) ? Bitmap.createBitmap(work, rx, ry, rw, rh) : work; cache.put(k, cropped); empty.remove(k); try { FileOutputStream o = new FileOutputStream(file(a, k)); cropped.compress(Bitmap.CompressFormat.JPEG, 95, o); o.close(); } catch (Exception ignored) {} cell.invalidate(); } })',
              '      .setNeutralButton("Ripristina", new DialogInterface.OnClickListener() { @Override public void onClick(DialogInterface d, int w) { cache.remove(k); empty.put(k, Boolean.TRUE); file(a, k).delete(); cell.invalidate(); } })',
              '      .setNegativeButton("Annulla", null).show();',
              '  }',
              '}'
          ]
          mgr_file = "TMessagesProj/src/main/java/org/telegram/messenger/LocalPhotoOverrideManager.java"
          open(mgr_file, "w").write("\n".join(java_lines))
          cp = "TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java"
          cell = open(cp).read()
          cell = re.sub(
              r"protected\s+void\s+onDraw\s*\(\s*Canvas\s+canvas\s*\)\s*\{\s*(?=if\s*\(\s*currentMessageObject\s*==\s*null)",
              "protected void onDraw(Canvas canvas) { onDrawWisby(canvas); org.telegram.messenger.LocalPhotoOverrideManager.onCellDraw(this, canvas); } private void onDrawWisby(Canvas canvas) {\n",
              cell,
              count=1
          )
          cell = re.sub(
              r"public\s+boolean\s+onTouchEvent\s*\(\s*MotionEvent\s+event\s*\)\s*\{",
              "public boolean onTouchEvent(MotionEvent event) { org.telegram.messenger.LocalPhotoOverrideManager.onCellTouch(this, event); ",
              cell
          )
          open(cp, "w").write(cell)
          EOF
          python3 patch_wisby.py
          javac -source 1.8 -target 1.8 -bootclasspath $ANDROID_HOME/platforms/android-36/android.jar TMessagesProj/src/main/java/org/telegram/messenger/LocalPhotoOverrideManager.java
          rm -f TMessagesProj/src/main/java/org/telegram/messenger/*.class
          echo "Verifica Java e correzione XML superate al 100%!"
      - name: 6. Prepara Keystore e Compila APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          rm -f /tmp/release.keystore
          keytool -genkey -v -keystore /tmp/release.keystore -alias alias_name -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=WisbyGram, OU=Dev, O=Wisby, L=Rome, S=IT, C=IT"
          for dir in . TMessagesProj TMessagesProj_App TMessagesProj_AppStandalone; do
            if [ -d "$dir" ]; then
              mkdir -p "$dir/config"
              cp /tmp/release.keystore "$dir/config/release.keystore"
              cp /tmp/release.keystore "$dir/config/debug.keystore"
              cp /tmp/release.keystore "$dir/release.keystore"
            fi
          done
          sed -i '/RELEASE_KEY_PASSWORD/d;/RELEASE_KEY_ALIAS/d;/RELEASE_STORE_PASSWORD/d;/org.gradle.jvmargs/d' gradle.properties || true
          printf "\nRELEASE_KEY_PASSWORD=android\nRELEASE_KEY_ALIAS=alias_name\nRELEASE_STORE_PASSWORD=android\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n" >> gradle.properties
          chmod +x gradlew
          set +e
          echo "1/2 Verifica rapida Java e Risorse XML (1 min)..."
          ./gradlew :TMessagesProj_App:compileAfatDebugJavaWithJavac -PRELEASE_KEY_PASSWORD=android -PRELEASE_KEY_ALIAS=alias_name -PRELEASE_STORE_PASSWORD=android --no-daemon --console=plain > build.log 2>&1
          STATUS=$?
          if [ $STATUS -eq 0 ]; then
            echo "Verifica Java e XML superata! 2/2 Compilazione C++ e creazione APK..."
            ./gradlew :TMessagesProj_App:assembleAfatDebug -PRELEASE_KEY_PASSWORD=android -PRELEASE_KEY_ALIAS=alias_name -PRELEASE_STORE_PASSWORD=android --no-daemon --console=plain >> build.log 2>&1
            STATUS=$?
          fi
          if [ $STATUS -ne 0 ]; then
            echo "=== ERRORE ESATTO ==="
            grep -E "FAILURE:|What went wrong|Execution failed|error:|Exception|> Could not" -A 8 build.log | tail -n 45
            exit $STATUS
          fi
      - name: 7. Salva Cache C++ NDK
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: wisby-cxx-arm64-v5
      - name: 8. Carica APK finito
        uses: actions/upload-artifact@v4
        with:
          name: WisbyGram-APK
          path: |
            **/*.apk
# === FINE FILE ===
