name: Compila WisbyGram APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 0. Libera spazio su disco (rimuove vecchi NDK inutilizzati)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk/* || true
          df -h

      - name: 1. Scarica codice WisbyGram
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 2. Installa Java 17 e Cache Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Installa esattamente SDK 36, NDK 27 e CMake richiesti da Telegram
        run: |
          sudo chmod -R 777 $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018" \
            "ndk;21.4.7075529" \
            "cmake;3.22.1" \
            "cmake;3.18.1"

      - name: 4. Inietta Editor Foto Locale (100% Standard Android SDK)
        env:
          APP_ID: ${{ secrets.TG_APP_ID }}
          APP_HASH: ${{ secrets.TG_APP_HASH }}
        run: |
          python3 - << 'EOF'
          import os, re, glob

          # 1. Riduci la RAM massima richiesta da Gradle per evitare crash sul server GitHub
          if os.path.exists("gradle.properties"):
              with open("gradle.properties", "r") as f:
                  gp = f.read()
              gp = re.sub(r"org\.gradle\.jvmargs=.*", "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8", gp)
              if "org.gradle.workers.max" not in gp:
                  gp += "\norg.gradle.workers.max=2\n"
              with open("gradle.properties", "w") as f:
                  f.write(gp)

          # 2. Compila solo arm64-v8a per dimezzare i tempi e non esaurire spazio/RAM
          for gf in glob.glob("**/build.gradle", recursive=True):
              with open(gf, "r", errors="ignore") as f:
                  c = f.read()
              c_new = c.replace("'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'", "'arm64-v8a'")
              c_new = c_new.replace('"armeabi-v7a", "arm64-v8a", "x86", "x86_64"', '"arm64-v8a"')
              if c_new != c:
                  with open(gf, "w") as f:
                      f.write(c_new)

          # 3. Inserisci API_ID e API_HASH in BuildVars.java (se forniti nei Secrets)
          raw_id = re.sub(r"[^0-9]", "", os.environ.get("APP_ID", "").strip())
          raw_hash = re.sub(r"[^a-zA-Z0-9]", "", os.environ.get("APP_HASH", "").strip())
          bv_path = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if os.path.exists(bv_path) and raw_id and raw_hash:
              with open(bv_path, "r") as f:
                  bv = f.read()
              bv = re.sub(r"APP_ID\s*=\s*[^;]+;", f"APP_ID = {raw_id};", bv)
              bv = re.sub(r'APP_HASH\s*=\s*"[^"]*";', f'APP_HASH = "{raw_hash}";', bv)
              with open(bv_path, "w") as f:
                  f.write(bv)

          # 4. Crea LocalPhotoOverrideManager.java (Zero dipendenze da classi interne di Telegram)
          manager_path = "TMessagesProj/src/main/java/org/telegram/messenger/LocalPhotoOverrideManager.java"
          manager_code = '''package org.telegram.messenger;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.Fragment;
          import android.content.Context;
          import android.content.ContextWrapper;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.net.Uri;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.lang.reflect.Field;
          import java.lang.reflect.Method;
          import java.util.concurrent.ConcurrentHashMap;

          public class LocalPhotoOverrideManager {
              private static final ConcurrentHashMap<String, Bitmap> memoryCache = new ConcurrentHashMap<>();
              private static final ConcurrentHashMap<String, Boolean> noOverrideCache = new ConcurrentHashMap<>();
              private static final Handler mainHandler = new Handler(Looper.getMainLooper());
              private static Runnable pendingLongPress;
              private static float downX, downY;

              private static Activity findActivity(Context ctx) {
                  while (ctx instanceof ContextWrapper) {
                      if (ctx instanceof Activity) return (Activity) ctx;
                      ctx = ((ContextWrapper) ctx).getBaseContext();
                  }
                  return null;
              }

              private static String getMessageKey(View cell) {
                  try {
                      Method getMsg = cell.getClass().getMethod("getMessageObject");
                      Object msgObj = getMsg.invoke(cell);
                      if (msgObj == null) return null;
                      int msgId = (Integer) msgObj.getClass().getMethod("getId").invoke(msgObj);
                      long dialogId = (Long) msgObj.getClass().getMethod("getDialogId").invoke(msgObj);
                      return dialogId + "_" + msgId;
                  } catch (Throwable t) {
                      return null;
                  }
              }

              private static float[] findImageBounds(View cell) {
                  float bestX = 0, bestY = 0, bestW = 0, bestH = 0;
                  try {
                      Field f = cell.getClass().getDeclaredField("photoImage");
                      f.setAccessible(true);
                      Object ir = f.get(cell);
                      if (ir != null) {
                          float w = ((Number) ir.getClass().getMethod("getImageWidth").invoke(ir)).floatValue();
                          float h = ((Number) ir.getClass().getMethod("getImageHeight").invoke(ir)).floatValue();
                          if (w > 40 && h > 40) {
                              float x = ((Number) ir.getClass().getMethod("getImageX").invoke(ir)).floatValue();
                              float y = ((Number) ir.getClass().getMethod("getImageY").invoke(ir)).floatValue();
                              return new float[]{x, y, w, h};
                          }
                      }
                  } catch (Throwable ignored) {}

                  try {
                      for (Field f : cell.getClass().getDeclaredFields()) {
                          f.setAccessible(true);
                          Object val = f.get(cell);
                          if (val != null && val.getClass().getSimpleName().equals("ImageReceiver")) {
                              float w = ((Number) val.getClass().getMethod("getImageWidth").invoke(val)).floatValue();
                              float h = ((Number) val.getClass().getMethod("getImageHeight").invoke(val)).floatValue();
                              if (w * h > bestW * bestH && w > 60 && h > 60) {
                                  bestW = w;
                                  bestH = h;
                                  bestX = ((Number) val.getClass().getMethod("getImageX").invoke(val)).floatValue();
                                  bestY = ((Number) val.getClass().getMethod("getImageY").invoke(val)).floatValue();
                              }
                          }
                      }
                  } catch (Throwable ignored) {}

                  if (bestW > 60 && bestH > 60) {
                      return new float[]{bestX, bestY, bestW, bestH};
                  }
                  if (cell.getMeasuredWidth() > 120 && cell.getMeasuredHeight() > 120) {
                      return new float[]{24f, 12f, cell.getMeasuredWidth() - 48f, cell.getMeasuredHeight() - 24f};
                  }
                  return null;
              }

              private static File getFile(Context ctx, String key) {
                  File dir = new File(ctx.getFilesDir(), "wisby_photo_overrides");
                  if (!dir.exists()) dir.mkdirs();
                  return new File(dir, key + ".jpg");
              }

              public static Bitmap getOverride(Context ctx, String key) {
                  if (key == null) return null;
                  Bitmap b = memoryCache.get(key);
                  if (b != null && !b.isRecycled()) return b;
                  if (Boolean.TRUE.equals(noOverrideCache.get(key))) return null;
                  File f = getFile(ctx, key);
                  if (f.exists()) {
                      Bitmap disk = BitmapFactory.decodeFile(f.getAbsolutePath());
                      if (disk != null) {
                          memoryCache.put(key, disk);
                          return disk;
                      }
                  }
                  noOverrideCache.put(key, Boolean.TRUE);
                  return null;
              }

              public static void saveOverride(Context ctx, String key, Bitmap bmp) {
                  if (ctx == null || key == null || bmp == null) return;
                  Bitmap copy = bmp.copy(Bitmap.Config.ARGB_8888, false);
                  memoryCache.put(key, copy);
                  noOverrideCache.remove(key);
                  try (FileOutputStream out = new FileOutputStream(getFile(ctx, key))) {
                      copy.compress(Bitmap.CompressFormat.JPEG, 95, out);
                  } catch (Exception ignored) {}
              }

              public static void clearOverride(Context ctx, String key) {
                  if (key == null) return;
                  memoryCache.remove(key);
                  noOverrideCache.put(key, Boolean.TRUE);
                  if (ctx != null) {
                      File f = getFile(ctx, key);
                      if (f.exists()) f.delete();
                  }
              }

              public static void onCellDraw(View cell, Canvas canvas) {
                  String key = getMessageKey(cell);
                  if (key == null) return;
                  Bitmap over = getOverride(cell.getContext(), key);
                  if (over == null || over.isRecycled()) return;
                  float[] b = findImageBounds(cell);
                  if (b == null) return;
                  RectF dst = new RectF(b[0], b[1], b[0] + b[2], b[1] + b[3]);
                  int save = canvas.save();
                  Path clip = new Path();
                  clip.addRoundRect(dst, 24f, 24f, Path.Direction.CW);
                  canvas.clipPath(clip);
                  canvas.drawBitmap(over, null, dst, null);
                  canvas.restoreToCount(save);
              }

              public static void onCellTouch(final View cell, MotionEvent event) {
                  int action = event.getActionMasked();
                  if (action == MotionEvent.ACTION_DOWN) {
                      downX = event.getX();
                      downY = event.getY();
                      if (pendingLongPress != null) mainHandler.removeCallbacks(pendingLongPress);
                      pendingLongPress = new Runnable() {
                          @Override
                          public void run() {
                              String key = getMessageKey(cell);
                              float[] bounds = findImageBounds(cell);
                              if (key != null && bounds != null && cell.getMeasuredHeight() > 140) {
                                  showFloatingEditButton(cell, key, bounds);
                              }
                          }
                      };
                      mainHandler.postDelayed(pendingLongPress, 450);
                  } else if (action == MotionEvent.ACTION_MOVE) {
                      if (Math.abs(event.getX() - downX) > 30 || Math.abs(event.getY() - downY) > 30) {
                          if (pendingLongPress != null) mainHandler.removeCallbacks(pendingLongPress);
                      }
                  } else if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {
                      if (pendingLongPress != null) mainHandler.removeCallbacks(pendingLongPress);
                  }
              }

              private static void showFloatingEditButton(final View cell, final String key, final float[] bounds) {
                  final Activity act = findActivity(cell.getContext());
                  if (act == null) return;
                  final ViewGroup decor = (ViewGroup) act.getWindow().getDecorView();
                  final View old = decor.findViewWithTag("wisby_float_btn");
                  if (old != null) decor.removeView(old);

                  final Button btn = new Button(act);
                  btn.setTag("wisby_float_btn");
                  btn.setText("✏️ Modifica Foto (Locale)");
                  btn.setTextColor(Color.WHITE);
                  btn.setBackgroundColor(Color.parseColor("#E61E88E5"));
                  btn.setPadding(40, 24, 40, 24);

                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT
                  );
                  lp.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  lp.topMargin = 140;
                  decor.addView(btn, lp);

                  final Runnable autoRemove = new Runnable() {
                      @Override
                      public void run() {
                          if (btn.getParent() != null) decor.removeView(btn);
                      }
                  };
                  mainHandler.postDelayed(autoRemove, 4500);

                  btn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          mainHandler.removeCallbacks(autoRemove);
                          if (btn.getParent() != null) decor.removeView(btn);
                          openEditor(act, cell, key, bounds);
                      }
                  });
              }

              public static class GalleryFragment extends Fragment {
                  public Bitmap targetBitmap;
                  public View targetView;

                  public void pick() {
                      Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                      intent.setType("image/*");
                      startActivityForResult(Intent.createChooser(intent, "Scegli Foto"), 9992);
                  }

                  @Override
                  public void onActivityResult(int req, int res, Intent data) {
                      super.onActivityResult(req, res, data);
                      if (req == 9992 && res == Activity.RESULT_OK && data != null && data.getData() != null && getActivity() != null) {
                          try {
                              Uri u = data.getData();
                              InputStream is = getActivity().getContentResolver().openInputStream(u);
                              Bitmap picked = BitmapFactory.decodeStream(is);
                              if (is != null) is.close();
                              if (picked != null && targetBitmap != null) {
                                  Canvas c = new Canvas(targetBitmap);
                                  c.drawBitmap(picked, null, new Rect(0, 0, targetBitmap.getWidth(), targetBitmap.getHeight()), null);
                                  if (targetView != null) targetView.invalidate();
                              }
                          } catch (Exception ignored) {}
                      }
                  }
              }

              private static void openEditor(final Activity act, final View cell, final String key, float[] bounds) {
                  Bitmap base = getOverride(act, key);
                  if (base == null) {
                      try {
                          int w = Math.max(200, (int) bounds[2]);
                          int h = Math.max(200, (int) bounds[3]);
                          Bitmap snap = Bitmap.createBitmap(cell.getWidth(), cell.getHeight(), Bitmap.Config.ARGB_8888);
                          Canvas sc = new Canvas(snap);
                          cell.draw(sc);
                          int x = Math.max(0, Math.min((int) bounds[0], snap.getWidth() - 1));
                          int y = Math.max(0, Math.min((int) bounds[1], snap.getHeight() - 1));
                          int cw = Math.min(w, snap.getWidth() - x);
                          int ch = Math.min(h, snap.getHeight() - y);
                          if (cw > 20 && ch > 20) {
                              base = Bitmap.createBitmap(snap, x, y, cw, ch);
                          }
                      } catch (Throwable ignored) {}
                  }

                  final Bitmap working = (base != null && !base.isRecycled())
                      ? base.copy(Bitmap.Config.ARGB_8888, true)
                      : Bitmap.createBitmap(800, 800, Bitmap.Config.ARGB_8888);
                  if (base == null) working.eraseColor(Color.DKGRAY);

                  final Canvas drawCanvas = new Canvas(working);
                  final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  paint.setColor(Color.RED);
                  paint.setStrokeWidth(18f);
                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeCap(Paint.Cap.ROUND);
                  paint.setStrokeJoin(Paint.Join.ROUND);

                  final View drawView = new View(act) {
                      private float lx, ly;
                      private final Rect dst = new Rect();
                      @Override
                      protected void onDraw(Canvas c) {
                          super.onDraw(c);
                          dst.set(0, 0, getWidth(), getHeight());
                          c.drawBitmap(working, null, dst, null);
                      }
                      @Override
                      public boolean onTouchEvent(MotionEvent e) {
                          float x = e.getX() * ((float) working.getWidth() / Math.max(1, getWidth()));
                          float y = e.getY() * ((float) working.getHeight() / Math.max(1, getHeight()));
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              lx = x; ly = y;
                              drawCanvas.drawPoint(x, y, paint);
                              invalidate();
                              return true;
                          } else if (e.getAction() == MotionEvent.ACTION_MOVE) {
                              drawCanvas.drawLine(lx, ly, x, y, paint);
                              lx = x; ly = y;
                              invalidate();
                              return true;
                       
