          ahash = re.sub(r"[^a-zA-Z0-9]", "", os.environ.get("APP_HASH", "")) or "014b35b6184100b085b0d0572f9b5103"
          bv_p = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if os.path.exists(bv_p):
              bv = open(bv_p).read()
              bv = re.sub(r"APP_ID\s*=\s*[^;]+;", f"APP_ID = {aid};", bv)
              bv = re.sub(r'APP_HASH\s*=\s*"[^"]*";', f'APP_HASH = "{ahash}";', bv)
              bv = re.sub(r'HUAWEI_APP_ID\s*=\s*[^;]+;', 'HUAWEI_APP_ID = "";', bv)
              open(bv_p, "w").write(bv)
          pkgs = {"org.telegram.messenger", "org.telegram.messenger.beta", "org.telegram.messenger.web", "org.telegram.messenger.regular"}
          for gf in glob.glob("**/build.gradle", recursive=True):
              c = open(gf, "r", errors="ignore").read()
              for m in re.findall(r'org\.telegram\.[a-zA-Z0-9_.]+', c): pkgs.add(m)
              c2 = c.replace('"armeabi-v7a", "arm64-v8a", "x86", "x86_64"', '"arm64-v8a"').replace("'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'", "'arm64-v8a'").replace('"armeabi-v7a", "arm64-v8a"', '"arm64-v8a"').replace("'armeabi-v7a', 'arm64-v8a'", "'arm64-v8a'")
              if c2 != c: open(gf, "w").write(c2)
          gs = {"project_info": {"project_number": "1234567890", "firebase_url": "https://telegram.firebaseio.com", "project_id": "telegram-mod", "storage_bucket": "telegram-mod.appspot.com"}, "client": [{"client_info": {"mobilesdk_app_id": f"1:1234567890:android:{1000+i}", "android_client_info": {"package_name": p}}, "api_key": [{"current_key": "AIzaSyDummyKeyForCompilationOnly123456"}]} for i, p in enumerate(sorted(pkgs))], "configuration_version": "1"}
          for d in glob.glob("TMessagesProj*"):
              if os.path.isdir(d): json.dump(gs, open(os.path.join(d, "google-services.json"), "w"))
          EOF
