name: Compila WisbyGram APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 0. Libera spazio su disco del server
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: 1. Scarica codice WisbyGram
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 2. Installa Java 17 e Cache Gradle (Velocizza compilazione)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Prepara Android SDK e NDK nativo
        run: |
          yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "cmake;3.18.1" "platforms;android-34" "build-tools;34.0.0" || true
          sudo chmod -R 777 $ANDROID_HOME

      - name: 4. Applica Modifiche e Configurazione
        env:
          APP_ID: ${{ secrets.TG_APP_ID }}
          APP_HASH: ${{ secrets.TG_APP_HASH }}
        run: |
          python3 - << 'EOF'
          import os, re, json, glob

          # 0. Crea google-services.json per tutti i pacchetti possibili
          gs_data = {
            "project_info": {
              "project_number": "1234567890",
              "firebase_url": "https://telegram.firebaseio.com",
              "project_id": "telegram-mod",
              "storage_bucket": "telegram-mod.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": f"1:1234567890:android:123456789{i}",
                  "android_client_info": { "package_name": pkg }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForCompilationOnly123456" }]
              }
              for i, pkg in enumerate([
                "org.telegram.messenger",
                "org.telegram.messenger.beta",
                "org.telegram.messenger.web",
                "org.telegram.messenger.regular"
              ])
            ],
            "configuration_version": "1"
          }
          for folder in ["TMessagesProj", "TMessagesProj_App", "TMessagesProj_AppStandalone"]:
              if os.path.exists(folder):
                  with open(f"{folder}/google-services.json", "w") as f:
                      json.dump(gs_data, f)

          # 1. Crea LocalPhotoOverrideManager.java (Zero dipendenze esterne fragili)
          manager_path = "TMessagesProj/src/main/java/org/telegram/messenger/LocalPhotoOverrideManager.java"
          manager_code = '''package org.telegram.messenger;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.view.MotionEvent;
          import android.view.View;
          import android.widget.LinearLayout;
          import android.widget.Button;
          import java.io.File;
          import java.io.FileOutputStream;

          public class LocalPhotoOverrideManager {
              public interface OnOverrideSavedListener { void onSaved(); }

              private static File getOverrideDir() {
                  File dir = new File(ApplicationLoader.getFilesDirFixed(), "local_photo_overrides");
                  if (!dir.exists()) dir.mkdirs();
                  return dir;
              }

              public static File getOverrideFile(long dialogId, int messageId) {
                  return new File(getOverrideDir(), dialogId + "_" + messageId + ".jpg");
              }

              public static boolean hasOverride(long dialogId, int messageId) {
                  return getOverrideFile(dialogId, messageId).exists();
              }

              public static boolean saveOverrideBitmap(long dialogId, int messageId, Bitmap bitmap) {
                  if (bitmap == null) return false;
                  try (FileOutputStream out = new FileOutputStream(getOverrideFile(dialogId, messageId))) {
                      bitmap.compress(Bitmap.CompressFormat.JPEG, 95, out);
                      return true;
                  } catch (Exception e) { return false; }
              }

              public static void clearOverride(long dialogId, int messageId) {
                  File f = getOverrideFile(dialogId, messageId);
                  if (f.exists()) f.delete();
              }

              public static void showQuickDrawDialog(Activity activity, Bitmap baseBitmap, long dialogId, int messageId, OnOverrideSavedListener listener) {
                  if (activity == null) return;
                  final Bitmap workingBitmap = (baseBitmap != null)
                      ? baseBitmap.copy(Bitmap.Config.ARGB_8888, true)
                      : Bitmap.createBitmap(800, 800, Bitmap.Config.ARGB_8888);
                  if (baseBitmap == null) workingBitmap.eraseColor(Color.DKGRAY);

                  final Canvas canvas = new Canvas(workingBitmap);
                  final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  paint.setColor(Color.RED);
                  paint.setStrokeWidth(16f);
                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeCap(Paint.Cap.ROUND);

                  View drawView = new View(activity) {
                      private float lastX, lastY;
                      @Override
                      protected void onDraw(Canvas c) {
                          super.onDraw(c);
                          c.drawBitmap(workingBitmap, null, new android.graphics.Rect(0, 0, getWidth(), getHeight()), null);
                      }
                      @Override
                      public boolean onTouchEvent(MotionEvent event) {
                          float x = event.getX() * ((float) workingBitmap.getWidth() / Math.max(1, getWidth()));
                          float y = event.getY() * ((float) workingBitmap.getHeight() / Math.max(1, getHeight()));
                          if (event.getAction() == MotionEvent.ACTION_DOWN) {
                              lastX = x; lastY = y; canvas.drawPoint(x, y, paint); invalidate(); return true;
                          } else if (event.getAction() == MotionEvent.ACTION_MOVE) {
                              canvas.drawLine(lastX, lastY, x, y, paint); lastX = x; lastY = y; invalidate(); return true;
                          }
                          return super.onTouchEvent(event);
                      }
                  };

                  LinearLayout container = new LinearLayout(activity);
                  container.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout colorBar = new LinearLayout(activity);
                  int[] colors = {Color.RED, Color.GREEN, Color.BLUE, Color.YELLOW, Color.WHITE, Color.BLACK};
                  for (int col : colors) {
                      Button btn = new Button(activity);
                      btn.setBackgroundColor(col);
                      btn.setLayoutParams(new LinearLayout.LayoutParams(0, 110, 1f));
                      btn.setOnClickListener(v -> paint.setColor(col));
                      colorBar.addView(btn);
                  }
                  container.addView(colorBar);
                  container.addView(drawView, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 850));

                  new AlertDialog.Builder(activity)
                      .setTitle("Modifica Foto (Solo per te)")
                      .setView(container)
                      .setPositiveButton("Salva", (d, w) -> {
                          saveOverrideBitmap(dialogId, messageId, workingBitmap);
                          ImageLoader.getInstance().clearMemory();
                          if (listener != null) listener.onSaved();
                      })
                      .setNeutralButton("Ripristina", (d, w) -> {
                          clearOverride(dialogId, messageId);
                          ImageLoader.getInstance().clearMemory();
                          if (listener != null) listener.onSaved();
                      })
                      .setNegativeButton("Annulla", null)
                      .show();
              }
          }
          '''
          with open(manager_path, "w") as f:
              f.write(manager_code)

          # 2. Inserisci API ID e API HASH in modo sicuro in BuildVars.java
          raw_id = os.environ.get("APP_ID", "").strip()
          app_id = re.sub(r"[^0-9]", "", raw_id)
          if not app_id: app_id = "4"
          app_hash = os.environ.get("APP_HASH", "").strip() or "014b35b6184100b085b0d0572f9b5103"

          bv_path = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          with open(bv_path, "r") as f: bv = f.read()
          bv = re.sub(r"APP_ID\s*=\s*[^;]+;", f"APP_ID = {app_id};", bv)
          bv = re.sub(r'APP_HASH\s*=\s*"[^"]*";', f'APP_HASH = "{app_hash}";', bv)
          with open(bv_path, "w") as f: f.write(bv)

          # 3. Modifica solo ChatMessageCell.java (Tieni premuto sulla foto o toccala con doppio tap/menu)
          cell_path = "TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java"
          with open(cell_path, "r") as f: cell = f.read()

          override_hook = '''
              if (currentMessageObject != null && org.telegram.messenger.LocalPhotoOverrideManager.hasOverride(currentMessageObject.getDialogId(), currentMessageObject.getId())) {
                  java.io.File lf = org.telegram.messenger.LocalPhotoOverrideManager.getOverrideFile(currentMessageObject.getDialogId(), currentMessageObject.getId());
                  photoImage.setImage(org.telegram.messenger.ImageLocation.getForPath(lf.getAbsolutePath()), "800_800", null, null, 0, null, currentMessageObject, 0);
                  currentMessageObject.mediaSpoilerRevealed = true;
              }
          '''
          if "requestLayout();" in cell:
              cell = cell.replace("requestLayout();", override_hook + "\nrequestLayout();", 1)
          with open(cell_path, "w") as f: f.write(cell)

          # 4. Modifica ChatActivity.java senza usare variabili interne soggette a cambi versione
          chat_path = "TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java"
          with open(chat_path, "r") as f: chat = f.read()

          menu_hook = '''
              if (selectedObject != null) {
                  items.add("Modifica foto (Locale)");
                  options.add(9991);
                  icons.add(R.drawable.msg_edit);
              }
          '''
          chat = chat.replace("if (options.size() == 0) {", menu_hook + "\nif (options.size() == 0) {", 1)

          action_hook = '''
              if (option == 9991 && selectedObject != null) {
                  android.graphics.Bitmap bmp = null;
                  if (org.telegram.messenger.LocalPhotoOverrideManager.hasOverride(selectedObject.getDialogId(), selectedObject.getId())) {
                      bmp = android.graphics.BitmapFactory.decodeFile(org.telegram.messenger.LocalPhotoOverrideManager.getOverrideFile(selectedObject.getDialogId(), selectedObject.getId()).getAbsolutePath());
                  } else {
                      java.io.File orig = org.telegram.messenger.FileLoader.getInstance(currentAccount).getPathToMessage(selectedObject.messageOwner);
                      if (orig != null && orig.exists()) {
                          bmp = android.graphics.BitmapFactory.decodeFile(orig.getAbsolutePath());
                      }
                  }
                  org.telegram.messenger.LocalPhotoOverrideManager.showQuickDrawDialog(getParentActivity(), bmp, selectedObject.getDialogId(), selectedObject.getId(), () -> {
                      if (chatAdapter != null) chatAdapter.notifyDataSetChanged();
                  });
                  return;
              }
          '''
          chat = chat.replace("public void processSelectedOption(int option) {", "public void processSelectedOption(int option) {\n" + action_hook, 1)
          with open(chat_path, "w") as f: f.write(chat)
          EOF

      - name: 5. Configura Keystore universale
        run: |
          mkdir -p TMessagesProj/config
          for ks in release.keystore debug.keystore; do
            rm -f TMessagesProj/config/$ks
            keytool -genkey -v -keystore TMessagesProj/config/$ks \
              -alias alias_name -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=WisbyGram, OU=Dev, O=Wisby, L=Rome, S=IT, C=IT"
          done
          cat << 'EOP' >> gradle.properties
          RELEASE_KEY_PASSWORD=android
          RELEASE_KEY_ALIAS=alias_name
          RELEASE_STORE_PASSWORD=android
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          EOP

      - name: 6. Compila APK (Veloce arm64)
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleArm64Debug || ./gradlew assembleArm64Debug || ./gradlew assembleAfatDebug

      - name: 7. Carica APK finito
        uses: actions/upload-artifact@v4
        with:
          name: WisbyGram-APK
          path: |
            **/*.apk
